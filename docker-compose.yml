name: nexora

x-backend-environment: &backend-environment
  ENVIRONMENT: development
  DEBUG: "true"
  REFRESH_COOKIE_SECURE: "false"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-secret-change-me-1234567890}
  # Dev-only default. Must be a valid Fernet key (32 url-safe base64 bytes) —
  # generate a real one for any non-local environment, never reuse this.
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-NnxfjGzrhIft6hYs51IFZkuAcX7A6mr67TfxR7Xu76c=}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-nexora_app}:${POSTGRES_APP_PASSWORD:-nexora_app_pw}@postgres:5432/${POSTGRES_DB:-nexora}
  DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_APP_USER:-nexora_app}:${POSTGRES_APP_PASSWORD:-nexora_app_pw}@postgres:5432/${POSTGRES_DB:-nexora}
  DATABASE_OWNER_URL: postgresql+psycopg://${POSTGRES_USER:-nexora_owner}:${POSTGRES_PASSWORD:-nexora_owner_pw}@postgres:5432/${POSTGRES_DB:-nexora}
  REDIS_URL: redis://:${REDIS_PASSWORD:-nexora_redis_pw}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-nexora_redis_pw}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-nexora_redis_pw}@redis:6379/2
  CORS_ORIGINS: http://localhost:3000
  QDRANT_URL: http://qdrant:6333
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}

x-backend-dependencies: &backend-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
      POSTGRES_USER: ${POSTGRES_USER:-nexora_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_owner_pw}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-nexora_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-nexora_app_pw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-nexora_redis_pw}"]
    volumes: ["redis_data:/data"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nexora_redis_pw}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: {context: ./backend}
    environment: *backend-environment
    depends_on: *backend-dependencies
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build: {context: ./backend}
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: {context: ./backend}
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app:celery", "worker", "--loglevel=INFO"]

  # Celery beat is a separate scheduler process. `beat_schedule` in
  # workers/tasks/outbox.py only declares the 10s outbox drain — a worker on its
  # own never fires it, so without this service every verification, reset and
  # invitation mail is enqueued and never sent.
  #
  # It is its own service rather than `worker -B` because beat must be a
  # singleton: scaling `worker` to N replicas with -B gives N schedulers. The
  # drain itself is safe under that (FOR UPDATE SKIP LOCKED), but the schedule
  # is meant to tick once.
  beat:
    build: {context: ./backend}
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # --schedule: the Dockerfile's runtime stage COPYs /app as root before
    # switching to the unprivileged `nexora` user, so /app itself is not
    # writable by that user — celery beat's default schedule file (created
    # in the process's CWD) would fail with a permission error. The user's
    # own home directory (from `useradd --create-home`) is writable.
    command: ["celery", "-A", "app.workers.celery_app:celery", "beat", "--loglevel=INFO", "--schedule=/home/nexora/celerybeat-schedule"]

  frontend:
    build: {context: ./frontend}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      # Upstash REST credentials (KV_REST_API_URL/TOKEN) take priority over
      # this when both are set — see bff-session.ts. Unset here, so local
      # dev exercises the TCP fallback client, matching what's actually
      # live in production today.
      BFF_REDIS_URL: redis://:${REDIS_PASSWORD:-nexora_redis_pw}@redis:6379/3
      BFF_SESSION_SECRET: ${BFF_SESSION_SECRET:-development-bff-session-secret-change-me}
      NEXT_PUBLIC_API_BASE_URL: /api/bff
      DEMO_ACCOUNT_EMAIL: ${DEMO_ACCOUNT_EMAIL:-demo@nexora.ai}
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:-NexoraDemo!2026}
    depends_on:
      backend:
        condition: service_healthy
    ports: ["3000:3000"]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes: ["minio_data:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes: ["qdrant_data:/qdrant/storage"]
    ports: ["6333:6333"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
