name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  JWT_SECRET_KEY: "01234567890123456789012345678901"
  FIELD_ENCRYPTION_KEY: "NnxfjGzrhIft6hYs51IFZkuAcX7A6mr67TfxR7Xu76c="
  DATABASE_URL: postgresql+asyncpg://nexora_app:app_pw@127.0.0.1:5432/nexora_test
  DATABASE_URL_SYNC: postgresql+psycopg://nexora_app:app_pw@127.0.0.1:5432/nexora_test
  DATABASE_OWNER_URL: postgresql+psycopg://nexora_owner:owner_pw@127.0.0.1:5432/nexora_test
  REDIS_URL: redis://127.0.0.1:6379/0
  CELERY_BROKER_URL: redis://127.0.0.1:6379/1
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e './backend[dev]'
      - run: ruff format --check . && ruff check .
        working-directory: backend
      - run: mypy app
        working-directory: backend

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: nexora_test, POSTGRES_USER: nexora_owner, POSTGRES_PASSWORD: owner_pw}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora_owner -d nexora_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      QDRANT_URL: http://127.0.0.1:6333
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      # No worker runs in CI; without this, anything that calls .delay()
      # for real just queues into Redis and nothing ever picks it up.
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e './backend[dev]'
      - name: Create non-owner application role
        env: {PGPASSWORD: owner_pw}
        run: psql -h 127.0.0.1 -U nexora_owner -d nexora_test -v ON_ERROR_STOP=1 -c "CREATE ROLE nexora_app LOGIN PASSWORD 'app_pw' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS" -c "GRANT CONNECT ON DATABASE nexora_test TO nexora_app" -c "GRANT USAGE ON SCHEMA public TO nexora_app" -c "ALTER DEFAULT PRIVILEGES FOR ROLE nexora_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO nexora_app"
      - name: Start MinIO and Qdrant
        # `services:` cannot override a container's command, and the official
        # minio/minio image needs `server /data` as an argument to do
        # anything — so these run as plain containers instead, using the
        # same tags already proven in docker-compose.yml.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          docker run -d --name qdrant -p 6333:6333 qdrant/qdrant:v1.15.5
      - name: Wait for MinIO and Qdrant
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors http://127.0.0.1:9000/minio/health/live
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors http://127.0.0.1:6333/healthz
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
        working-directory: backend

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: nexora_test, POSTGRES_USER: nexora_owner, POSTGRES_PASSWORD: owner_pw}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora_owner -d nexora_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ./backend
      - name: Create application role
        env: {PGPASSWORD: owner_pw}
        run: psql -h 127.0.0.1 -U nexora_owner -d nexora_test -c "CREATE ROLE nexora_app LOGIN PASSWORD 'app_pw' NOSUPERUSER NOBYPASSRLS" -c "ALTER DEFAULT PRIVILEGES FOR ROLE nexora_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO nexora_app"
      - run: alembic upgrade head && alembic check && alembic downgrade -1 && alembic upgrade head
        working-directory: backend

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck
        working-directory: frontend

  frontend-tests:
    runs-on: ubuntu-latest
    # The BFF single-flight refresh lock lives in Redis, and its tests use the
    # real thing — a mocked lock would only prove the mock is exclusive.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      BFF_REDIS_URL: redis://127.0.0.1:6379/3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run test
        working-directory: frontend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend

  security:
    runs-on: ubuntu-latest
    steps:
      # gitleaks needs real history to diff-scan a push: a shallow (depth-1)
      # checkout only has the latest commit, so it cannot resolve the parent
      # of the oldest commit whenever a push carries more than one.
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -e ./backend pip-audit
      - run: pip-audit
      - run: npm ci && npm audit --audit-level=high
        working-directory: frontend
      - uses: gitleaks/gitleaks-action@v3

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build postgres redis migrate backend frontend
      - run: curl --fail --retry 20 --retry-delay 3 --retry-all-errors http://localhost:8000/health
      - run: curl --fail --retry 20 --retry-delay 3 --retry-all-errors http://localhost:3000/
      - if: always()
        run: docker compose logs && docker compose down -v
