[project]
name = "nexora-backend"
version = "0.1.0"
description = "Nexora AI modular monolith backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "anthropic>=1,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "cryptography>=48.0.1,<51",  # 46.0.7 had 4 known CVEs (pip-audit); floor is the first fixed release.
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  # Server is pinned to 1.15.5 in dev, CI and production. Qdrant supports a
  # one-minor client/server difference; a broad <2 range had already resolved
  # to 1.19 and emitted compatibility warnings on every request.
  "qdrant-client>=1.15,<1.17",
  "boto3>=1.40,<2",
  "pypdf>=6,<7",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "pyotp>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
  "uuid6>=2024.7.10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "testcontainers[postgres,redis]>=4.9,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true  # Celery 5 does not publish PEP 561 type metadata.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["concurrency: tests requiring committed parallel transactions"]

[tool.coverage.run]
branch = true
source = ["app"]
# SQLAlchemy's async engine bridges every awaited DB call through a greenlet
# switch (asyncpg via `greenlet_spawn`); without this, coverage.py's tracer
# does not follow execution across that switch, so anything after the first
# awaited query in a function silently reads as "missing" even though a
# passing test just executed it — a measurement bug, not a testing gap.
concurrency = ["greenlet"]

[[tool.mypy.overrides]]
# boto3/botocore ship no py.typed marker; the stubs package is a large
# dependency for three call sites in DocumentStorage.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
